name: Build VPN Products Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.ts"
      - "src/**"
      - "public/**"
      - "supabase/mobile-push-notifications.sql"
      - "supabase/functions/order-notifications/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web and Capacitor dependencies
        run: npm install

      - name: Build the website bundle
        run: npm run build

      - name: Generate the native Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Firebase Android client
        if: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON != '' }}
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not root.exists() or not app.exists():
              raise SystemExit("Capacitor Android Gradle files were not generated.")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Could not locate Android root Gradle dependencies block.")
              root_text = root_text.replace(marker, marker + "\n        classpath 'com.google.gms:google-services:4.4.4'", 1)
              root.write_text(root_text)
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n"
              app.write_text(app_text)
          print("Firebase Google Services configuration added.")
          PY

      - name: Configure optional Play Store upload signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-key.jks
            python3 - <<'PY'
          from pathlib import Path
          app = Path("android/app/build.gradle")
          text = app.read_text()
          if "signingConfigs {" not in text:
              signing = """
              signingConfigs {
                  release {
                      storeFile file("upload-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
              text = text.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          if "signingConfig signingConfigs.release" not in text:
              text = text.replace("        release {", "        release {\n            signingConfig signingConfigs.release", 1)
          app.write_text(text)
          PY
            echo "Release signing configured."
          else
            echo "Upload keystore secrets are not configured; only a debug APK will be generated."
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build signed Play Store bundle
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpn-products-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 14
