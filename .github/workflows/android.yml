name: Build VPN Products Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.ts"
      - "src/**"
      - "public/**"
      - "supabase/mobile-push-notifications.sql"
      - "supabase/functions/order-notifications/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web and Capacitor dependencies
        run: npm install

      - name: Build the website bundle
        env:
          VITE_SUPABASE_URL: https://huvpbhmqeijhksjfkoqa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add VITE_SUPABASE_PUBLISHABLE_KEY in GitHub repository Settings > Secrets and variables > Actions before building the production Android app."
            exit 1
          fi
          npm run build

      - name: Generate the native Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Firebase Android client
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add ANDROID_GOOGLE_SERVICES_JSON in GitHub repository Settings > Secrets and variables > Actions. The file must come from Firebase Android app com.vpnproducts.services."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          package_names = [client.get("client_info", {}).get("android_client_info", {}).get("package_name")
                           for client in config.get("client", [])]
          if "com.vpnproducts.services" not in package_names:
              raise SystemExit("google-services.json must include Android package com.vpnproducts.services.")
          print("Firebase Android configuration validated.")
          PY

      - name: Configure optional Play Store upload signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-key.jks
            python3 - <<'PY'
          from pathlib import Path
          app = Path("android/app/build.gradle")
          text = app.read_text()
          if "signingConfigs {" not in text:
              signing = """
              signingConfigs {
                  release {
                      storeFile file("upload-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
              text = text.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          if "signingConfig signingConfigs.release" not in text:
              text = text.replace("        release {", "        release {\n            signingConfig signingConfigs.release", 1)
          app.write_text(text)
          PY
            echo "Release signing configured."
          else
            echo "Upload keystore secrets are not configured; only a debug APK will be generated."
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build signed Play Store bundle when upload key is configured
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            echo "Upload keystore secrets are not configured; skipping signed release APK/AAB."
          fi

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpn-products-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 14
