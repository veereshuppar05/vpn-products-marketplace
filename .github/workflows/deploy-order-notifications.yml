name: Deploy order notifications Edge Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/order-notifications/**"
      - ".github/workflows/deploy-order-notifications.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: huvpb...REPLACEME
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy order-notifications function
        run: supabase functions deploy order-notifications --project-ref "$SUPABASE_PROJECT_ID" --yes
